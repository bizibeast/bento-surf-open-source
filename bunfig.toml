[install]
# Supply-chain guard: skip package versions published less than seven days ago.
minimumReleaseAge = 604800
# Security patches are pinned in package.json. minimatch 11.0.1 fixes
# GHSA-g3hv-75wg-m249 before it reaches the seven-day release age; its new
# @isaacs/nonrecursive-glob-match dependency is pinned for the same reason.
minimumReleaseAgeExcludes = ["source-map-js", "minimatch", "@isaacs/nonrecursive-glob-match"]
